worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Augmenter la taille du corps de la requête autorisée
        client_max_body_size 500M;  # Ajustez cette valeur selon vos besoins

        # Proxy requests to the app service
        location / {
            proxy_pass http://172.17.57.110:36785;  # Remplacez par le port utilisé par votre service app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location / {
