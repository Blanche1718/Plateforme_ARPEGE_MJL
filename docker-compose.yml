services:
  notation_db:
    image: postgres
    restart: always
    env_file: ./.env
    container_name: notation_db
    shm_size: 128mb
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: $DB_NAME
    volumes:
      - pgdata_ebnl:/var/lib/postgresql/data
    networks:
      - simjl

  app:
    depends_on:
      - notation_db
    command: ["sh", "-c", "./scripts/waitforit.sh notation_db:5432 -- sh -c 'until nc -z notation_minio 9000; do sleep 1; done; /usr/src/app/start.sh'"]
    # command: ["sh", "-c", "node /app/db/seedDatabase.js && npm run dev"]
    build:
      context: .
      dockerfile: Dockerfile  # Ensure this points to your Dockerfile
    restart: always
    env_file: ./.env
    container_name: notation_api
    # ports:  
    #   - "$SERVER_PORT:$SERVER_PORT"
    environment:
      - DB_HOST=$DB_HOST
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - DB_NAME=$DB_NAME
      - DB_PORT=$DB_PORT
      - MINIO_ENDPOINT=$MINIO_ENDPOINT
      - MINIO_PORT=$MINIO_PORT
      - MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY=$MINIO_SECRET_KEY
      - MINIO_USE_SSL=$MINIO_USE_SSL
      - MINIO_BUCKET_NAME=$MINIO_BUCKET_NAME
    volumes:
      - .:/app  
    networks:
      - simjl

  adminer:
    image: adminer
    restart: always
    container_name: notation_adminer
    ports:  
      - "$DB_ADMIN_PORT:8080" 
    networks:
      - simjl

  nginx:
    image: nginx:stable-alpine
    container_name: notation_proxy
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:  
      - "$EXPOSED_PORT:80"  # Expose Nginx to the host on port 8080
    networks:
      - simjl

  notation_minio:
    image: quay.io/minio/minio
    container_name: notation_minio
    ports:
      - $MINIO_PORT:9000
      - $MINIO_CONSOLE_PORT:9001
    restart: always
    environment:
      MINIO_ROOT_USER: $MINIO_ACCESS_KEY
      MINIO_ROOT_PASSWORD: $MINIO_SECRET_KEY
    command: server /data
    volumes:
      - minio_data:/data
    networks:
      - simjl

networks:
  simjl:
    # external: true
    driver: bridge
      


volumes:
  pgdata_ebnl:
  minio_data:

