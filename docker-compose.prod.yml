  ebnl:
    # command: ["sh", "-c", "./scripts/waitforit.sh db:5432 -- sh -c 'until nc -z minio $MINIO_PORT; do sleep 1; done; npm run dev'"]
    command: npm run prod
    env_file: ./.env.prod
    build:
      context: .
      dockerfile: Dockerfile.prod  # Ensure this points to your Dockerfile
    restart: always
    container_name: backend_ebnl
    environment:
      - DB_HOST=$DB_HOST
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - DB_NAME=$DB_NAME
      - DB_PORT=$DB_PORT
      - MINIO_ENDPOINT=$MINIO_ENDPOINT
      - MINIO_PORT=$MINIO_PORT
      - MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY=$MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=ebnl
    volumes:
      - .:/app  
    networks:
      - simjl
    ports:
      - "$EXPOSED_PORT:$SERVER_PORT"

